name: Publish GitHub Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "openwiki/**"
      - ".github/workflows/publish-github-wiki.yml"

permissions:
  contents: read

concurrency:
  group: publish-github-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.OPENWIKI_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENWIKI_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Publish reviewed OpenWiki pages
        id: publish
        uses: dipjyotimetia/openwiki-github-wiki-action@eb2c178a6c00c3ee82c86fa195b00ac23b7ce6e9
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer-name: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Add publication summary
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit-sha }}
          WIKI_URL: ${{ steps.publish.outputs.wiki-url }}
        run: |
          {
            echo "## GitHub Wiki publication"
            echo
            echo "- Changed: \`$CHANGED\`"
            echo "- Commit: \`${COMMIT_SHA:-no change}\`"
            echo "- Wiki: $WIKI_URL"
          } >> "$GITHUB_STEP_SUMMARY"
