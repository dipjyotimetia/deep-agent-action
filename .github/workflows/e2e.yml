# Live end-to-end test harness.
#
# Drives the action AS SHIPPED against this repository with a real model and the
# real GitHub API, asserting real effects (PR opened, draft created, audit
# record emitted) and cleaning up after itself.
#
# Runs manually and nightly. All jobs are skipped cleanly when the
# PROVIDER_API_KEY secret is absent (so forks / no-key runs don't fail).
# Cost: a few tiny gpt-4o-mini calls — cents per run.
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC nightly

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  E2E_MODEL: "openai:gpt-4o-mini"

jobs:
  # Secrets can't be used in job-level `if:`, so expose the presence of the key
  # as an output the live jobs gate on.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.PROVIDER_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PROVIDER_API_KEY not set; skipping live E2E jobs."
          fi

  # Feature: implement on workflow_dispatch -> opens a PR. Also validates the
  # result_json output and the uploaded audit artifact.
  implement:
    needs: preflight
    if: needs.preflight.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Run agent (implement)
        id: agent
        uses: ./
        with:
          model: ${{ env.E2E_MODEL }}
          prompt: "Create /demo/E2E_HELLO.md containing a single short greeting line. Do not modify any other files."
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}

      - name: Assert success + PR opened + result_json shape
        env:
          STATUS: ${{ steps.agent.outputs.status }}
          PR_URL: ${{ steps.agent.outputs.pr_url }}
          RESULT_JSON: ${{ steps.agent.outputs.result_json }}
        run: |
          echo "status=$STATUS pr_url=$PR_URL"
          test "$STATUS" = "success" || { echo "::error::expected status=success, got '$STATUS'"; exit 1; }
          test -n "$PR_URL" || { echo "::error::no pr_url output"; exit 1; }
          printf '%s' "$RESULT_JSON" | EXPECT_STATUS=success bun run scripts/e2e/assert-result.ts

      - name: Download audit artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.agent.outputs.audit_artifact }}
          path: ./artifact

      - name: Validate audit artifact
        run: EXPECT_STATUS=success bun run scripts/e2e/assert-result.ts "./artifact/${{ steps.agent.outputs.audit_artifact }}.json"

      - name: Cleanup (close PR + delete branch)
        if: always() && steps.agent.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.agent.outputs.pr_url }}
        run: gh pr close "$PR_URL" --delete-branch || true

  # Feature: human-in-the-loop gate -> change lands as a DRAFT PR.
  # Runs after `implement` to keep the live model calls and GitHub mutations
  # deterministic; branches and audit artifacts are isolated per invocation.
  approval-gate:
    needs: [preflight, implement]
    if: needs.preflight.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Run agent (approval gate)
        id: agent
        uses: ./
        with:
          model: ${{ env.E2E_MODEL }}
          require_push_approval: "true"
          prompt: "Create /demo/E2E_APPROVAL.md with a single short line. Do not modify any other files."
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}

      - name: Assert draft PR + approvalPending
        env:
          STATUS: ${{ steps.agent.outputs.status }}
          PR_URL: ${{ steps.agent.outputs.pr_url }}
          RESULT_JSON: ${{ steps.agent.outputs.result_json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$STATUS" = "success" || { echo "::error::status='$STATUS'"; exit 1; }
          test -n "$PR_URL" || { echo "::error::no pr_url output"; exit 1; }
          printf '%s' "$RESULT_JSON" | bun run scripts/e2e/assert-result.ts
          printf '%s' "$RESULT_JSON" | jq -e '.approvalPending == true' >/dev/null \
            || { echo "::error::expected approvalPending=true in result_json"; exit 1; }
          IS_DRAFT=$(gh pr view "$PR_URL" --json isDraft -q .isDraft)
          test "$IS_DRAFT" = "true" || { echo "::error::expected a draft PR, isDraft=$IS_DRAFT"; exit 1; }

      - name: Cleanup (close PR + delete branch)
        if: always() && steps.agent.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.agent.outputs.pr_url }}
        run: gh pr close "$PR_URL" --delete-branch || true

  # Feature: budget circuit-breaker -> a tiny token cap aborts the run mid-flight
  # and sets budget_stopped. This is the one thing unit tests can't prove: that
  # the callback meter + AbortSignal actually fire end-to-end through the
  # deepagents/LangGraph stack. If any partial work was committed before the
  # abort, the forced-approval path must land it as a DRAFT.
  # Serialized after the others to keep the live model calls deterministic.
  budget-cap:
    needs: [preflight, approval-gate]
    if: needs.preflight.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Run agent (budget cap)
        id: agent
        uses: ./
        with:
          model: ${{ env.E2E_MODEL }}
          # A cap below a single model call's token count guarantees the run trips
          # on the first response, exercising the abort path deterministically.
          max_total_tokens: "50"
          prompt: "Create /demo/E2E_BUDGET.md with a single short line. Do not modify any other files."
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}

      - name: Assert budget_stopped (+ draft PR if any partial work landed)
        env:
          STATUS: ${{ steps.agent.outputs.status }}
          BUDGET_STOPPED: ${{ steps.agent.outputs.budget_stopped }}
          PR_URL: ${{ steps.agent.outputs.pr_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "status=$STATUS budget_stopped=$BUDGET_STOPPED pr_url=$PR_URL"
          test "$STATUS" = "success" || { echo "::error::status='$STATUS'"; exit 1; }
          test "$BUDGET_STOPPED" = "true" \
            || { echo "::error::expected budget_stopped=true, got '$BUDGET_STOPPED'"; exit 1; }
          if [ -n "$PR_URL" ]; then
            IS_DRAFT=$(gh pr view "$PR_URL" --json isDraft -q .isDraft)
            test "$IS_DRAFT" = "true" \
              || { echo "::error::partial work must land as a draft, isDraft=$IS_DRAFT"; exit 1; }
          fi

      - name: Cleanup (close PR + delete branch)
        if: always() && steps.agent.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.agent.outputs.pr_url }}
        run: gh pr close "$PR_URL" --delete-branch || true

  # Security regression: an agent may be able to alter a protected path through
  # an allowed shell command, but the control plane must refuse to publish it.
  protected-path:
    needs: [preflight, budget-cap]
    if: needs.preflight.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Attempt protected guidance change
        id: agent
        continue-on-error: true
        uses: ./
        with:
          model: ${{ env.E2E_MODEL }}
          prompt: >-
            Use an allowed shell command to create .deepagents/E2E_PROTECTED.md containing one short line.
            Do not modify any other file.
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}

      - name: Assert protected-path refusal
        if: always()
        env:
          OUTCOME: ${{ steps.agent.outcome }}
          STATUS: ${{ steps.agent.outputs.status }}
          PR_URL: ${{ steps.agent.outputs.pr_url }}
          RESULT_JSON: ${{ steps.agent.outputs.result_json }}
        run: |
          test "$OUTCOME" = "failure" || { echo "::error::protected-path run unexpectedly succeeded"; exit 1; }
          test "$STATUS" = "failed" || { echo "::error::expected status=failed, got '$STATUS'"; exit 1; }
          test -z "$PR_URL" || { echo "::error::protected-path run published '$PR_URL'"; exit 1; }
          printf '%s' "$RESULT_JSON" | jq -e '.error | contains("Refusing to publish protected paths: .deepagents/E2E_PROTECTED.md.")' >/dev/null \
            || { echo "::error::missing protected-path refusal in result_json"; exit 1; }
