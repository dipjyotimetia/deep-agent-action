name: "Deep Agent Action"
description: "Issue/PR coding agent powered by the Deep Agents JS harness, running in-process on the runner."
author: "Dipjyoti Metia"
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  trigger_phrase:
    description: "Phrase that triggers the agent in issue/PR/comment bodies."
    required: false
    default: "@agent"
  prompt:
    description: "Explicit instruction for workflow_dispatch runs (bypasses the trigger phrase)."
    required: false
  model:
    description: >-
      Model id, optionally provider-prefixed. Providers: anthropic, openai, azure, google (Gemini),
      openrouter, openai-compatible (+ base_url), bedrock (AWS), vertexai (GCP). Examples:
      'claude-sonnet-5', 'openai:gpt-5', 'google:gemini-2.5-pro', 'openrouter:openai/gpt-4o',
      'bedrock:anthropic.claude-3-5-sonnet-20241022-v2:0', 'openai-compatible:llama-3.1-70b'.
    required: false
    default: "claude-sonnet-5"
  base_url:
    description: "Endpoint URL for the 'openai-compatible' provider (Groq, xAI, DeepSeek, Together, Ollama, vLLM, …)."
    required: false
  mcp_config:
    description: 'MCP servers JSON: { "mcpServers": { name: { command, args, env } | { url } } }. Tools are exposed to the agent. With the Docker sandbox on, stdio servers run in containers too.'
    required: false
  harness_profile:
    description: >-
      Optional deepagents harness profile JSON. Supports systemPromptSuffix, toolDescriptionOverrides,
      excludedTools, excludedMiddleware, and generalPurposeSubagent. Strictly validated before execution.
    required: false
  filesystem_permissions:
    description: >-
      Optional deepagents filesystem permission rules JSON. Each rule has operations (read/write), absolute
      glob paths, and optional mode (allow/deny). Built-in filesystem writes under .deepagents stay denied.
    required: false
  subagents:
    description: >-
      Optional specialist-subagent JSON. Each item requires name, description, and systemPrompt; it may select
      explicit MCP tools, repository .deepagents skills, restrictive filesystem deny rules, a model, and
      responseMode: findings. The built-in general-purpose subagent cannot be replaced.
    required: false
  allowed_permissions:
    description: "Comma-separated repository permission levels allowed to trigger the agent."
    required: false
    default: "write,admin"
  allowed_commands:
    description: "Comma/newline-separated allow-list of shell command names the agent may run. Defaults to a common dev toolchain."
    required: false
  denied_commands:
    description: "Extra command names to block (merged with the built-in deny-list)."
    required: false
  fork_allow_label:
    description: "Label a write-access user can apply to authorize the agent on a fork PR. If unset, fork PRs are never run."
    required: false
  auto_run_label:
    description: "Label that, when applied to an issue, triggers the agent without a trigger-phrase match."
    required: false
  auto_run_assignee:
    description: "GitHub username that, when assigned to an issue, triggers the agent without a trigger-phrase match."
    required: false
  auto_run_default_instruction:
    description: "Fallback instruction for an auto-run (auto_run_label/auto_run_assignee) event when the issue has no title/body text."
    required: false
  shell_timeout_seconds:
    description: "Max seconds for a single shell command."
    required: false
    default: "600"
  shell_sandbox:
    description: >-
      Where model-directed shell commands run. 'auto' uses Docker when shell_sandbox_image is set. Without an image
      it refuses runs driven by outside input (fork PR code, or an issue someone other than the actor wrote) and warns
      on the rest. 'docker' requires the image. 'none' explicitly accepts running on the runner, where commands can
      read this action's secrets through /proc on Linux. Docker needs a Linux runner with a daemon.
    required: false
    default: "auto"
  shell_sandbox_image:
    description: "Container image providing your toolchain for sandboxed shell commands and stdio MCP servers. Pin it by digest. Setting this turns the sandbox on."
    required: false
  shell_sandbox_network:
    description: "Container network for sandboxed shell commands: 'none' (default) or 'bridge', needed if commands install dependencies."
    required: false
    default: "none"
  mcp_sandbox_network:
    description: "Container network for sandboxed stdio MCP servers: 'bridge' (default) or 'none'."
    required: false
    default: "bridge"
  comment_debounce_ms:
    description: "Minimum interval between tracking-comment progress edits."
    required: false
    default: "8000"
  provider_api_key:
    description: >-
      Model provider API key (anthropic/openai/google/openrouter/openai-compatible). May also be supplied via
      PROVIDER_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY / GOOGLE_API_KEY / OPENROUTER_API_KEY env.
      Bedrock uses the AWS env chain; Vertex AI and Azure use their own standard env vars.
    required: false
  app_id:
    description: "GitHub App id used to mint a scoped, short-lived installation token. May also be supplied via APP_ID env."
    required: false
  app_private_key:
    description: "GitHub App private key (PEM). May also be supplied via APP_PRIVATE_KEY env."
    required: false
  github_token:
    description: "Token for GitHub API/git operations. Defaults to the workflow's GITHUB_TOKEN, so no setup is needed. NOTE: PRs opened with GITHUB_TOKEN do not trigger downstream CI — configure a GitHub App (app_id + app_private_key) only if you need the agent's PRs to run your CI."
    required: false
    default: ${{ github.token }}
  require_push_approval:
    description: "Gate landing of changes behind human review: opens a draft PR (issue mode) or pushes a proposed branch with a compare link (PR mode)."
    required: false
    default: "true"
  protected_paths:
    description: >-
      Comma/newline-separated repository-relative globs for additional files the agent may never publish.
      Repository .deepagents guidance, deep-agent config paths, and .github/workflows are always protected.
    required: false
  verified_commits:
    description: >-
      Land commits via the GitHub App's createCommitOnBranch GraphQL mutation so they show as
      "Verified" on GitHub, instead of a plain git push. Requires app_id + app_private_key; the
      run fails loudly if set without App auth. Limitation: executable-bit/symlink changes are
      not preserved (files always land as mode 100644).
    required: false
    default: "false"
  enable_triage:
    description: >-
      Enable the label-backed issue-triage lifecycle. External contributors receive only safe
      classification/labels/comments; an agentic fix needs a permitted author or triage_run_label.
      Default off. Any resulting code change is always forced through the approval gate.
    required: false
    default: "false"
  triage_allowed_labels:
    description: "Deprecated; retained for compatibility and ignored by the lifecycle. Configure named triage_label_* inputs instead."
    required: false
  triage_model:
    description: "Model used for triage classification and final outcome assessment. Defaults to the 'model' input."
    required: false
  triage_label_needs_triage:
    description: "Lifecycle label for an issue currently being assessed."
    required: false
    default: "triage: needs triage"
  triage_label_needs_reproduction:
    description: "Lifecycle label for an issue missing a reproducible report."
    required: false
    default: "triage: needs reproduction"
  triage_label_unable_to_reproduce:
    description: "Lifecycle label for an issue the agent could not reproduce."
    required: false
    default: "triage: unable to reproduce"
  triage_label_unable_to_fix:
    description: "Lifecycle label for a reproduced issue with no safe fix."
    required: false
    default: "triage: unable to fix"
  triage_label_needs_maintainer:
    description: "Lifecycle label for an actionable external issue awaiting maintainer approval."
    required: false
    default: "triage: needs maintainer"
  triage_label_fix_proposed:
    description: "Lifecycle label for an issue with a draft fix proposal."
    required: false
    default: "triage: fix proposed"
  triage_label_not_actionable:
    description: "Lifecycle label for non-actionable issues."
    required: false
    default: "triage: not actionable"
  triage_label_skipped:
    description: "Lifecycle label for issues unsuitable for runner triage."
    required: false
    default: "triage: skipped"
  triage_label_failed:
    description: "Lifecycle label for unexpected triage failures."
    required: false
    default: "triage: failed"
  triage_run_label:
    description: "Label a permitted maintainer applies to start an agentic triage run."
    required: false
    default: "triage: run"
  triage_bot_logins:
    description: "Comma/newline-separated additional bot logins whose comments never trigger re-triage."
    required: false
  triage_max_failed_attempts:
    description: "Maximum automatic triage failures before manual intervention is required."
    required: false
    default: "3"
  max_cost_usd:
    description: "Abort the run once estimated spend reaches this many USD (requires a known model price; pair with max_total_tokens for unpriced models). Partial work lands as a draft for review. Unset = no cap."
    required: false
  max_total_tokens:
    description: "Abort the run once cumulative billed tokens (input + output, re-counted each model call as context grows — set generously) reach this many. Partial work lands as a draft for review. Unset = no cap."
    required: false
  max_runtime_minutes:
    description: "Abort the agent once it has run this many minutes; partial work lands as a draft for review (like a budget stop). Unset = no cap. (A job-level timeout-minutes still applies but kills the run without landing anything.)"
    required: false
  recursion_limit:
    description: "Max agent super-steps per run. Raise for very long multi-step tasks that reach the recursion ceiling."
    required: false
    default: "150"
  max_repeated_tool_calls:
    description: "Stop when the same tool call repeats with no todo progress or file edit in between. Default 8; raise only for intentional repeated operations."
    required: false
    default: "8"

outputs:
  status:
    description: "Run outcome: success | skipped | refused | failed."
    value: ${{ steps.agent.outputs.status }}
  pr_url:
    description: "URL of the opened pull request, if any."
    value: ${{ steps.agent.outputs.pr_url }}
  branch:
    description: "Branch the agent pushed to, if any."
    value: ${{ steps.agent.outputs.branch }}
  budget_stopped:
    description: "'true' when the run was stopped early by a cost/token budget cap (partial work opened for review)."
    value: ${{ steps.agent.outputs.budget_stopped }}
  timed_out:
    description: "'true' when the run was stopped early by max_runtime_minutes (partial work opened for review)."
    value: ${{ steps.agent.outputs.timed_out }}
  stalled:
    description: "'true' when the agent stopped after repeated no-progress tool calls or reaching its recursion ceiling; partial work is review-gated."
    value: ${{ steps.agent.outputs.stalled }}
  audit_artifact:
    description: "Invocation-unique name of the uploaded audit-record artifact."
    value: ${{ steps.audit.outputs.artifact_name }}
  result_json:
    description: "Machine-readable run record (plan, tool calls, files changed, outcome)."
    value: ${{ steps.agent.outputs.result_json }}

runs:
  using: "composite"
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.0"
        token: ${{ inputs.github_token || github.token }}

    - name: Initialize audit record
      id: audit
      shell: bash
      run: |
        audit_id="$(bun -e 'console.log(crypto.randomUUID())')"
        echo "audit_id=${audit_id}" >> "$GITHUB_OUTPUT"
        echo "artifact_name=deep-agent-run-${audit_id}" >> "$GITHUB_OUTPUT"
        echo "audit_path=${RUNNER_TEMP}/deep-agent-run-${audit_id}.json" >> "$GITHUB_OUTPUT"

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --production --frozen-lockfile

    - name: Run Deep Agent
      id: agent
      shell: bash
      run: bun run "${{ github.action_path }}/src/index.ts"
      env:
        DEEP_AGENT_AUDIT_PATH: ${{ steps.audit.outputs.audit_path }}
        DEEP_AGENT_INVOCATION_ID: ${{ steps.audit.outputs.audit_id }}
        INPUT_TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_BASE_URL: ${{ inputs.base_url }}
        INPUT_MCP_CONFIG: ${{ inputs.mcp_config }}
        INPUT_HARNESS_PROFILE: ${{ inputs.harness_profile }}
        INPUT_FILESYSTEM_PERMISSIONS: ${{ inputs.filesystem_permissions }}
        INPUT_SUBAGENTS: ${{ inputs.subagents }}
        INPUT_ALLOWED_PERMISSIONS: ${{ inputs.allowed_permissions }}
        INPUT_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
        INPUT_DENIED_COMMANDS: ${{ inputs.denied_commands }}
        INPUT_FORK_ALLOW_LABEL: ${{ inputs.fork_allow_label }}
        INPUT_AUTO_RUN_LABEL: ${{ inputs.auto_run_label }}
        INPUT_AUTO_RUN_ASSIGNEE: ${{ inputs.auto_run_assignee }}
        INPUT_AUTO_RUN_DEFAULT_INSTRUCTION: ${{ inputs.auto_run_default_instruction }}
        INPUT_SHELL_TIMEOUT_SECONDS: ${{ inputs.shell_timeout_seconds }}
        INPUT_SHELL_SANDBOX: ${{ inputs.shell_sandbox }}
        INPUT_SHELL_SANDBOX_IMAGE: ${{ inputs.shell_sandbox_image }}
        INPUT_SHELL_SANDBOX_NETWORK: ${{ inputs.shell_sandbox_network }}
        INPUT_MCP_SANDBOX_NETWORK: ${{ inputs.mcp_sandbox_network }}
        INPUT_COMMENT_DEBOUNCE_MS: ${{ inputs.comment_debounce_ms }}
        INPUT_PROVIDER_API_KEY: ${{ inputs.provider_api_key }}
        INPUT_APP_ID: ${{ inputs.app_id }}
        INPUT_APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_REQUIRE_PUSH_APPROVAL: ${{ inputs.require_push_approval }}
        INPUT_PROTECTED_PATHS: ${{ inputs.protected_paths }}
        INPUT_VERIFIED_COMMITS: ${{ inputs.verified_commits }}
        INPUT_ENABLE_TRIAGE: ${{ inputs.enable_triage }}
        INPUT_TRIAGE_ALLOWED_LABELS: ${{ inputs.triage_allowed_labels }}
        INPUT_TRIAGE_MODEL: ${{ inputs.triage_model }}
        INPUT_TRIAGE_LABEL_NEEDS_TRIAGE: ${{ inputs.triage_label_needs_triage }}
        INPUT_TRIAGE_LABEL_NEEDS_REPRODUCTION: ${{ inputs.triage_label_needs_reproduction }}
        INPUT_TRIAGE_LABEL_UNABLE_TO_REPRODUCE: ${{ inputs.triage_label_unable_to_reproduce }}
        INPUT_TRIAGE_LABEL_UNABLE_TO_FIX: ${{ inputs.triage_label_unable_to_fix }}
        INPUT_TRIAGE_LABEL_NEEDS_MAINTAINER: ${{ inputs.triage_label_needs_maintainer }}
        INPUT_TRIAGE_LABEL_FIX_PROPOSED: ${{ inputs.triage_label_fix_proposed }}
        INPUT_TRIAGE_LABEL_NOT_ACTIONABLE: ${{ inputs.triage_label_not_actionable }}
        INPUT_TRIAGE_LABEL_SKIPPED: ${{ inputs.triage_label_skipped }}
        INPUT_TRIAGE_LABEL_FAILED: ${{ inputs.triage_label_failed }}
        INPUT_TRIAGE_RUN_LABEL: ${{ inputs.triage_run_label }}
        INPUT_TRIAGE_BOT_LOGINS: ${{ inputs.triage_bot_logins }}
        INPUT_TRIAGE_MAX_FAILED_ATTEMPTS: ${{ inputs.triage_max_failed_attempts }}
        INPUT_MAX_COST_USD: ${{ inputs.max_cost_usd }}
        INPUT_MAX_TOTAL_TOKENS: ${{ inputs.max_total_tokens }}
        INPUT_MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
        INPUT_RECURSION_LIMIT: ${{ inputs.recursion_limit }}
        INPUT_MAX_REPEATED_TOOL_CALLS: ${{ inputs.max_repeated_tool_calls }}

    # Publish the audit record written by this invocation. The UUID suffix
    # prevents parallel or matrix jobs and repeated action steps from replacing
    # each other's immutable artifacts.
    - name: Upload audit record
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.audit.outputs.artifact_name }}
        path: ${{ steps.audit.outputs.audit_path }}
        if-no-files-found: ignore
